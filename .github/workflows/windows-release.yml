name: Build Windows release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Run unit tests
        shell: pwsh
        run: |
          python -m unittest discover -s tests -v
          python -m compileall -q macroflow main.py

      - name: Build application with Windows icon and theme assets
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name MacroFlow --icon assets/macroflow.ico --add-data "assets;assets" main.py

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --yes --no-progress
          }

      - name: Build Windows installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" "installer\macroflow.iss"

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          Get-ChildItem "installer_output\*.exe" | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Set-Content -Encoding ascii "$($_.FullName).sha256"
          }

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(Get-ChildItem "installer_output\*.exe", "installer_output\*.sha256" | ForEach-Object { $_.FullName })
          if ($assets.Count -lt 2) { throw "Installer or checksum not found" }
          gh release create "${{ github.ref_name }}" @assets --generate-notes --title "MacroFlow ${{ github.ref_name }}"
